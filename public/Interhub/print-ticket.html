<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>InternHub - In phiếu đánh giá</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    :root {
      --primary: #0a6a73;
      --surface: #ffffff;
      --surface-2: #f3f6f9;
      --text: #12212f;
      --text-muted: #556675;
      --border: #c9d3dc;
      --error: #a82e28;
    }

    body {
      margin: 0;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      max-width: 820px;
      margin: 16px auto 0;
      padding: 0 16px;
      flex-wrap: wrap;
    }
    .toolbar a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .btn {
      font: inherit;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost { background: var(--surface); color: var(--primary); }

    .message-box {
      max-width: 820px;
      margin: 40px auto;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--error);
      text-align: center;
      font-weight: 600;
    }

    .sheet {
      max-width: 820px;
      margin: 16px auto 40px;
      background: var(--surface);
      padding: 36px 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .sheet-head { text-align: center; margin-bottom: 20px; }
    .head-top { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; align-items: start; text-align: center; }
    .head-left { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 10px; }
    .sheet-head .logo { display: block; height: 56px; width: auto; max-width: 160px; object-fit: contain; flex-shrink: 0; transform: translateY(-2px); }
    .sheet-head .org { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text); text-align: center; line-height: 1.35; }
    .head-right { line-height: 1.35; }
    .head-right .national { font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .head-right .motto { font-size: 13px; font-weight: 700; text-decoration: underline; }
    @media (max-width: 600px) { .head-top { grid-template-columns: 1fr; } }
    .sheet-head h1 { font-size: 20px; margin: 6px 0 2px; text-transform: uppercase; letter-spacing: 0.02em; }
    .sheet-head .sub { color: var(--text-muted); }

    h2 { font-size: 14px; text-transform: uppercase; margin: 22px 0 8px; letter-spacing: 0.03em; }

    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--border); padding: 7px 9px; vertical-align: top; text-align: left; }
    th { background: var(--surface-2); font-weight: 600; font-size: 13px; }
    td.num, th.num { text-align: center; width: 60px; }
    td.score { text-align: center; width: 80px; font-variant-numeric: tabular-nums; }
    .info td:first-child { width: 34%; color: var(--text-muted); }
    .part-row td { background: var(--surface-2); font-weight: 600; }
    .result-table td, .result-table th { text-align: center; }
    .note-box { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; min-height: 48px; white-space: pre-wrap; }

    .signatures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 28px;
      text-align: center;
    }
    .signatures .title { font-weight: 600; }
    .signatures .hint { color: var(--text-muted); font-size: 12px; }
    .signatures .space { height: 70px; }

    @page { size: A4; margin: 10mm; }

    @media print {
      body { background: #fff; font-size: 12px; }
      .no-print { display: none !important; }
      .sheet { max-width: none; margin: 0; padding: 0; border: none; border-radius: 0; }
      th { background: #eee !important; }
      .part-row td { background: #f2f2f2 !important; }
      .note-box { border-color: #999; }
      tr, .signatures, .note-box, .info, .result-table { break-inside: avoid; }
      h2 { break-after: avoid; }
      body { font-size: 11px; }
      .sheet-head { margin-bottom: 6px; }
      .sheet-head h1 { font-size: 16px; margin: 4px 0 1px; }
      h2 { font-size: 12px; margin: 9px 0 4px; }
      th, td { padding: 2px 6px; line-height: 1.25; }
      th { font-size: 11px; }
      .note-box { min-height: 36px; padding: 6px 8px; }
      .signatures { margin-top: 14px; gap: 16px; }
      .signatures .space { height: 48px; }
    }

    @media (max-width: 600px) {
      .sheet { padding: 22px 16px; margin: 8px; }
      .sheet-page { padding: 22px 16px; }
      .signatures { grid-template-columns: 1fr; }
    }
    .sheet-page + .sheet-page { break-before: page; page-break-before: always; }
    .sheet-page { display: block; }

    /* Màn hình: mỗi phiếu là một tờ riêng, có khoảng cách và nhãn trang */
    #sheet.sheet { background: none; border: none; padding: 0; margin: 8px auto 40px; }
    .sheet-page {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 2px 10px rgba(16, 32, 46, 0.08);
      padding: 36px 40px; margin: 0 auto 28px; max-width: 820px;
    }
    .page-label { max-width: 820px; margin: 0 auto 6px; font-size: 12px; color: var(--text-muted); text-align: right; }

    /* Bản in: mỗi phiếu một trang A4, không khung, không khoảng cách */
    @media print {
      #sheet.sheet { margin: 0; background: none; border: none; padding: 0; }
      .sheet-page { background: none; border: none; box-shadow: none; padding: 0; margin: 0; max-width: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print" id="toolbar" hidden>
    <a href="./app.html?view=evaluations" id="backLink">← Quay lại danh sách phiếu</a>
    <button type="button" class="btn" id="printBtn">🖨 In phiếu</button>
  </div>

  <div class="message-box" id="loadingState">Đang tải phiếu...</div>

  <main class="sheet" id="sheet" hidden></main>

  <script type="module">
    import { Auth } from "./JS/auth.js";
    import {
      DemoStore, ITEMS, PARTS, STATUS, STATUS_LABEL, partScore, scoreSummary, formatDateTime
    } from "./JS/demo-store.js";

    // Thông tin in trên đầu phiếu. Đặt file logo tại assets/logo.png (nếu chưa có thì logo tự ẩn).
    const PRINT_CONFIG = {
      logoUrl: "./assets/logo.png",
      companyLines: ["CÔNG TY CPDV", "CÁP TREO BÀ NÀ"],
      nationalName: "CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM",
      nationalMotto: "Độc lập – Tự do – Hạnh phúc",
      formTitle: "PHIẾU ĐÁNH GIÁ SINH VIÊN THỰC TẬP"
    };

    const $ = id => document.getElementById(id);
    const ticketId = new URLSearchParams(window.location.search).get("id");

    // Tiêu đề kỳ đánh giá trên phiếu, ví dụ "KỲ ĐÁNH GIÁ THÁNG 11/2026"
    function periodTitle(period) {
      const m = /^(\d{4})-(\d{2})$/.exec(period?.month || "");
      if (m) return `KỲ ĐÁNH GIÁ THÁNG ${Number(m[2])}/${m[1]}`;
      return (period?.name || "").toUpperCase();
    }

    // Ngày chốt: chỉ ngày/tháng/năm
    function formatDateOnly(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString("vi-VN");
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function showError(text) {
      $("loadingState").hidden = false;
      $("loadingState").textContent = text;
      $("sheet").hidden = true;
      $("toolbar").hidden = true;
    }

    function fmt(v) {
      return v === null || v === undefined ? "—" : v.toFixed(2);
    }

    async function bootstrap() {
      if (!ticketId && !new URLSearchParams(window.location.search).get("ids")) return showError("❌ Không tìm thấy phiếu");

      let user = null;
      try {
        user = await Auth.waitForUser();
      } catch (error) {
        console.error("Không thể kiểm tra đăng nhập:", error);
      }
      if (!user) {
        window.location.replace("./index.html");
        return;
      }

      let profile = null;
      try {
        profile = await Auth.getProfile(user.uid);
      } catch (error) {
        console.error("Không thể tải hồ sơ người dùng:", error);
      }
      if (!profile || profile.status !== "approved" || profile.isActive !== true) {
        window.location.replace("./index.html");
        return;
      }
      profile = DemoStore.effectiveProfile(user.uid, profile);

      const actor = {
        uid: user.uid,
        name: profile.fullName || user.email,
        role: profile.role,
        department: profile.department
      };

      // Một phiếu (?id=) hoặc nhiều phiếu (?ids=a,b,c): mỗi phiếu một trang A4
      const idList = new URLSearchParams(window.location.search).get("ids");
      const ids = (idList || ticketId || "").split(",").map(x => x.trim()).filter(Boolean);
      if (!ids.length) return showError("❌ Thiếu mã phiếu");

      const tickets = [];
      for (const id of ids) {
        const t = DemoStore.getTicket(id);
        if (!t) return showError(`❌ Phiếu không tồn tại: ${id}`);
        if (!DemoStore.canView(t, actor)) return showError("❌ Bạn không có quyền xem phiếu này");
        if (!DemoStore.permissionsFor(t, actor).print) {
          return showError(`❌ Chỉ in được phiếu đã chốt. Phiếu ${t.internId} đang ở trạng thái: ${STATUS_LABEL[t.status] || t.status}.`);
        }
        tickets.push(t);
      }
      render(tickets);
    }

    function sheetHtml(t) {
      const period = DemoStore.listPeriods().find(p => p.id === t.periodId);
      const intern = DemoStore.listInterns().find(i => i.internId === t.internId);
      // Ngày chốt = thời điểm Tổ CTSV xác nhận chốt (ghi trong lịch sử phiếu)
      const finalizedAt = [...(t.history || [])].reverse().find(h => h.action === "Xác nhận chốt" || h.action === "Chốt phiếu")?.at;

      const summary = scoreSummary(t);
      const deptParts = summary.parts;

      const itemRows = PARTS.map((part, pIndex) => {
        const rows = ITEMS
          .map((item, i) => ({ item, i }))
          .filter(({ item }) => item.part === pIndex)
          .map(({ item, i }) => `
            <tr>
              <td class="num">${esc(item.key)}</td>
              <td>${esc(item.label)}</td>
              <td class="score">${t.scores[i] === null || t.scores[i] === undefined ? "—" : esc(t.scores[i])}</td>
            </tr>`).join("");
        return `
          <tr class="part-row"><td colspan="2">${esc(part.name)}</td><td class="score">${fmt(deptParts[pIndex])}</td></tr>
          ${rows}`;
      }).join("");

      return `
        <header class="sheet-head">
          <div class="head-top">
            <div class="head-left">
              <img class="logo" src="${esc(PRINT_CONFIG.logoUrl)}" alt="" onerror="this.remove()">
              <div class="org">${PRINT_CONFIG.companyLines.map(line => `<div>${esc(line)}</div>`).join("")}</div>
            </div>
            <div class="head-right">
              <div class="national">${esc(PRINT_CONFIG.nationalName)}</div>
              <div class="motto">${esc(PRINT_CONFIG.nationalMotto)}</div>
            </div>
          </div>
          <h1>${esc(PRINT_CONFIG.formTitle)}</h1>
          <div class="sub">${esc(periodTitle(period))}</div>
        </header>

        <h2>Thông tin thực tập sinh</h2>
        <table class="info">
          <tr><td>Mã SVTT</td><td>${esc(t.internId)}</td></tr>
          <tr><td>Họ và tên</td><td>${esc(t.internName)}</td></tr>
          <tr><td>Trường</td><td>${esc(intern?.school || t.school || "—")}</td></tr>
          <tr><td>Bộ phận</td><td>${esc(DemoStore.departmentName(t.department))}</td></tr>
          <tr><td>Người đánh giá</td><td>${esc(t.evaluatorName || "—")}</td></tr>
          <tr><td>Tổ Công tác sinh viên</td><td>${esc(t.committeeName || "—")}</td></tr>
          <tr><td>Ngày chốt phiếu</td><td>${esc(formatDateOnly(finalizedAt))}</td></tr>
        </table>

        <h2>Bảng điểm</h2>
        <table>
          <thead>
            <tr><th class="num">Mã</th><th>Nội dung đánh giá</th><th class="score">Điểm</th></tr>
          </thead>
          <tbody>${itemRows}</tbody>
        </table>

        <h2>Kết quả</h2>
        <table class="result-table">
          <tr>
            <th>Phần I</th><th>Phần II</th><th>Phần III</th><th>Điểm bộ phận</th><th>Điểm Tổ CTSV</th><th>Điểm đánh giá trung bình</th><th>Xếp loại</th>
          </tr>
          <tr>
            <td>${fmt(deptParts[0])}</td>
            <td>${fmt(deptParts[1])}</td>
            <td>${fmt(deptParts[2])}</td>
            <td>${fmt(summary.dept)}</td>
            <td>${fmt(summary.committee)}</td>
            <td><strong>${fmt(summary.final)}</strong></td>
            <td>${esc(DemoStore.ratingOf(summary.final))}</td>
          </tr>
        </table>

        <h2>Ưu điểm</h2>
        <div class="note-box">${esc(t.strengths || "")}</div>

        <h2>Điểm hạn chế cần cải thiện</h2>
        <div class="note-box">${esc(t.improvements || "")}</div>

        <div class="signatures">
          <div>
            <div class="title">Người đánh giá</div>
            <div class="hint">(Ký, ghi rõ họ tên)</div>
            <div class="space"></div>
            <div>${esc(t.evaluatorName || "")}</div>
          </div>
          <div>
            <div class="title">Tổ Công tác sinh viên</div>
            <div class="hint">(Ký, ghi rõ họ tên)</div>
            <div class="space"></div>
            <div>${esc(t.committeeName || "")}</div>
          </div>
        </div>
      `;
    }

    function render(list) {
      const sheet = $("sheet");
      sheet.innerHTML = list.map((t, i) => `
        <div class="page-label no-print">Phiếu ${i + 1} / ${list.length}</div>
        <section class="sheet-page">${sheetHtml(t)}</section>`).join("");
      sheet.hidden = false;
      $("toolbar").hidden = false;
      $("loadingState").hidden = true;
      // Không đặt tiêu đề trang: trình duyệt sẽ in tiêu đề này ở đầu mỗi trang
      document.title = " ";
    }

    $("printBtn").addEventListener("click", () => window.print());

    bootstrap();
  </script>
</body>
</html>
