<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>InternHub - Quản trị</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: "Be Vietnam Pro", sans-serif;
      background: #f3f6f9;
      color: #12212f;
    }
    .page { max-width: 1400px; margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { color: #556675; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #0a6a73; color: white; }
    .secondary { background: white; border: 1px solid #d3dce4; }
    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 12px #10202e12;
    }
    #adminPanelRoot { min-width: 0; }
    .notice {
      padding: 16px;
      border-radius: 8px;
      background: white;
      border: 1px solid #d3dce4;
      margin: 16px 0;
    }
    .error { color: #a82e28; }
    .hidden { display: none !important; }
    .ih-admin { width: 100%; }
    .ih-admin__header, .ih-section__heading {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .ih-admin__header h1 { margin: 0; }
    .ih-admin__eyebrow { font-size: 12px; letter-spacing: .08em; }
    .ih-admin__subhead { margin: 6px 0; }
    .ih-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
    .ih-tabs button { background: #f3f6f9; color: #12212f; }
    .ih-tabs button.is-active { background: #0a6a73; color: white; }
    .ih-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .ih-stat, .ih-panel {
      border: 1px solid #d3dce4; border-radius: 10px; padding: 18px;
      background: white; min-width: 0;
    }
    .ih-stat span, .ih-stat small { display: block; color: #556675; }
    .ih-stat strong { display: block; font-size: 28px; margin: 8px 0; }
    .ih-link-row {
      display: flex; justify-content: space-between; width: 100%;
      text-align: left; margin: 8px 0; background: #f3f6f9;
    }
    .ih-table-wrap { width: 100%; overflow-x: auto; }
    .ih-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ih-table th, .ih-table td {
      padding: 12px; text-align: left; border-bottom: 1px solid #e2e8ee;
      vertical-align: top;
    }
    .ih-table th { background: #f3f6f9; white-space: nowrap; }
    .ih-table td small { display: block; overflow-wrap: anywhere; color: #556675; margin-top: 4px; }
    .ih-table select {
      max-width: 190px; padding: 8px; border: 1px solid #d3dce4;
      border-radius: 6px; font: inherit; background: white;
    }
    .ih-actions { display: flex; gap: 6px; flex-wrap: wrap; min-width: 220px; }
    .ih-btn { padding: 8px 10px; font-size: 12px; }
    .ih-btn--primary { background: #0a6a73; color: white; }
    .ih-btn--secondary { background: white; border: 1px solid #d3dce4; }
    .ih-btn--danger { background: #a82e28; color: white; }
    .ih-notice { padding: 12px; margin: 12px 0; border-radius: 7px; background: #e8f5ee; }
    .ih-notice[data-type="error"] { background: #fbeceb; color: #a82e28; }
    .ih-status { display: inline-block; padding: 4px 8px; border-radius: 12px; background: #f3f6f9; }
    .ih-empty { color: #556675; text-align: center !important; padding: 24px !important; }
    .ih-error { padding: 16px; color: #a82e28; background: #fbeceb; border-radius: 8px; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .panel { padding: 14px; }
      h1 { font-size: 22px; }
    }

    /* Thuộc tính hidden luôn thắng, không bị style khác ghi đè */
    [hidden] { display: none !important; }

    /* ===== Form SVTT & nhập CSV ===== */
    .ih-form {
      background: #fff;
      border: 1px solid #e3e9ef;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
    }
    .ih-form h3 { margin: 0 0 14px; font-size: 16px; }
    .ih-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px 16px;
    }
    .ih-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #556675;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .ih-input, .ih-select {
      width: 100%;
      font: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid #d3dce4;
      border-radius: 8px;
      background: #f9fbfc;
      color: #12212f;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .ih-input:focus, .ih-select:focus {
      border-color: #0a6a73;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(10, 106, 115, .15);
    }
    .ih-input[readonly] { background: #eef2f5; color: #556675; }
    .ih-select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 34px;
      background-image:
        linear-gradient(45deg, transparent 50%, #556675 50%),
        linear-gradient(135deg, #556675 50%, transparent 50%);
      background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .ih-hint { display: block; margin-top: 4px; font-size: 11px; color: #8796a5; }
    .ih-form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    /* Nút chọn file CSV */
    .ih-file {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      margin: 12px 0;
    }
    .ih-file input[type="file"] { display: none; }
    .ih-file__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #0a6a73;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(10, 106, 115, .25);
      transition: background .15s;
    }
    .ih-file:hover .ih-file__btn { background: #074f56; }
    .ih-file__hint { font-size: 12px; color: #8796a5; }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>InternHub</h1>
        <p>Trang quản trị hệ thống</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <a id="backToAppBtn" class="secondary" href="./app.html" hidden
           style="align-items:center;padding:10px 14px;border-radius:8px;border:1px solid #d3dce4;background:#fff;color:#12212f;text-decoration:none;font-weight:600;font-size:14px;">
          ← Giao diện Phòng Nhân sự
        </a>
        <button id="signOutBtn" class="secondary" type="button">Đăng xuất</button>
      </div>
    </header>

    <div id="pageMessage" class="notice">Đang kiểm tra tài khoản...</div>
    <section id="adminPanelRoot" class="panel hidden"></section>
  </main>

  <script type="module">
    import { Auth } from "./JS/auth.js";
    import { AdminPanel } from "./JS/admin-panel.js";
    import { DemoStore } from "./JS/demo-store.js";

    // Admin kỹ thuật theo email; Phòng Nhân sự (hr) đã duyệt được vào với quyền nghiệp vụ
    async function resolveRole(user) {
      if ((user.email || "").toLowerCase() === "dptbinh193@gmail.com") return "admin";
      let profile = null;
      try {
        profile = await Auth.getProfile(user.uid);
      } catch (error) {
        console.error("Không thể tải hồ sơ:", error);
      }
      if (!profile || profile.status !== "approved" || profile.isActive !== true) return null;
      return DemoStore.effectiveProfile(user.uid, profile).role === "hr" ? "hr" : null;
    }

    const message = document.getElementById("pageMessage");
    const root = document.getElementById("adminPanelRoot");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
      message.classList.remove("hidden");
    }

    document.getElementById("signOutBtn").addEventListener("click", async () => {
      await Auth.signOut();
      window.location.replace("./index.html");
    });

    try {
      const user = await Auth.waitForUser();

      const role = user ? await resolveRole(user) : null;

      if (!user) {
        window.location.replace("./index.html");
      } else if (!role) {
        showMessage("Tài khoản này không có quyền truy cập trang quản trị.", true);
        await Auth.signOut();
        setTimeout(() => window.location.replace("./index.html"), 1800);
      } else {
        if (role === "hr") document.getElementById("backToAppBtn").hidden = false;
        showMessage(role === "admin" ? "Đã xác thực tài khoản Admin." : "Đã xác thực tài khoản Phòng Nhân sự.");
        root.classList.remove("hidden");
        await AdminPanel.init(root, { role });
        message.classList.add("hidden");
      }
    } catch (error) {
      console.error("Admin page error:", error);
      showMessage(
        "Không thể mở trang quản trị. Vui lòng kiểm tra đăng nhập và Firestore Rules.",
        true
      );
    }
  </script>
</body>
</html>
