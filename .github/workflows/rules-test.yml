name: Rules test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public/Interhub/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cài gói
        run: npm install
      - name: Sao chép Rules để Emulator đọc
        run: cp ../data/firestore.rules firestore.rules
      - name: Chạy test Firestore Rules
        run: npm test
